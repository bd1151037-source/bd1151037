<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>曹亦天 | 個人主頁</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
        }
        /* 亮麗動態漸層背景 */
        .bg-vibrant {
            background: linear-gradient(135deg, #FFE53B 0%, #FF2525 100%);
            background-size: 200% 200%;
            animation: gradientShift 5s ease infinite;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        /* 玻璃透視質感卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="min-h-screen bg-vibrant flex flex-col items-center justify-center p-6 selection:bg-pink-300 selection:text-white">

    <!-- 主容器 -->
    <main class="w-full max-w-sm glass-card rounded-[2rem] p-8 shadow-2xl text-center relative">
        
        <!-- 個人照片位置 (直接替換 img 的 src 即可) -->
        <div class="relative w-32 h-32 mx-auto mb-6">
            <div class="absolute inset-0 bg-gradient-to-tr from-yellow-400 to-pink-500 rounded-full animate-spin-slow blur-md opacity-70"></div>
            <div class="relative w-full h-full rounded-full border-4 border-white overflow-hidden bg-white flex items-center justify-center shadow-lg">
                <img src="profire.jpg" class="w-full h-full object-cover">
            </div>
        </div>

        <!-- 姓名與系所 -->
        <h1 class="text-3xl font-black text-gray-900 tracking-wide mb-1">曹亦天</h1>
        <p class="text-sm font-bold text-pink-600 mb-5">黎明技術學院 數位多媒體系</p>

        <!-- 簡介小語 -->
        <div class="bg-gray-50 p-4 rounded-2xl mb-6 shadow-inner">
            <p class="text-sm font-semibold text-gray-600 leading-relaxed">
                「喜歡簡單的生活，也希望每天都能學習新的知識，讓自己變得更好。」
            </p>
        </div>

        <!-- 聯絡方式 (移除 JS，改為純連結與文字) -->
        <div class="space-y-3">
            <!-- Email -->
            <a href="mailto:bd1151009@venus.lit.edu.tw" class="flex items-center gap-3 p-3 rounded-2xl bg-white border border-gray-100 hover:border-pink-300 hover:shadow-md transition-all group">
                <div class="w-10 h-10 rounded-xl bg-red-50 text-red-500 flex items-center justify-center text-lg group-hover:bg-red-500 group-hover:text-white transition-colors">
                    <i class="fa-solid fa-envelope"></i>
                </div>
                <div class="text-left min-w-0">
                    <p class="text-xs text-gray-400 font-bold">Email</p>
                    <p class="text-sm font-bold text-gray-800 truncate">bd1151009@venus...</p>
                </div>
            </a>

            <!-- Line ID -->
            <div class="flex items-center gap-3 p-3 rounded-2xl bg-white border border-gray-100 hover:border-green-300 hover:shadow-md transition-all group">
                <div class="w-10 h-10 rounded-xl bg-green-50 text-green-500 flex items-center justify-center text-xl group-hover:bg-green-500 group-hover:text-white transition-colors">
                    <i class="fa-brands fa-line"></i>
                </div>
                <div class="text-left">
                    <p class="text-xs text-gray-400 font-bold">Line ID</p>
                    <p class="text-sm font-bold text-gray-800">areeyaa_2</p>
                </div>
            </div>

            <!-- Instagram -->
            <a href="https://instagram.com/jan212550" target="_blank" rel="noopener noreferrer" class="flex items-center gap-3 p-3 rounded-2xl bg-white border border-gray-100 hover:border-purple-300 hover:shadow-md transition-all group">
                <div class="w-10 h-10 rounded-xl bg-purple-50 text-purple-500 flex items-center justify-center text-xl group-hover:bg-gradient-to-tr from-yellow-400 via-pink-500 to-purple-500 group-hover:text-white transition-colors">
                    <i class="fa-brands fa-instagram"></i>
                </div>
                <div class="text-left">
                    <p class="text-xs text-gray-400 font-bold">Instagram</p>
                    <p class="text-sm font-bold text-gray-800">@jan212550</p>
                </div>
            </a>
        </div>
    </main>

</body>
</html>
